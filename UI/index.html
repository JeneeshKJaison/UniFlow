<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFlow - Login</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    
    <div class="login-container">
        <!-- Floating decorative elements -->
        <div class="decoration shape-1"></div>
        <div class="decoration shape-2"></div>
        
        <main class="login-card glass-card">
            <div class="login-header">
                <h2>UniFlow</h2>
                <p>Welcome back! Please login to your account.</p>
            </div>

            <div id="loginError" class="error-banner"></div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="e.g. user@uniflow.edu" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-input-group">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="pwd-toggle-btn" id="toggleLoginPwd" title="Show/Hide Password">
                            <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary login-btn">Login</button>
            </form>

            <!-- Quick Demo Credentials Helper -->
            <div class="demo-credentials-box">
                <div class="demo-title">
                    <span>Quick Demo Credentials</span>
                    <small style="color: var(--text-light); font-weight: normal;">Click to autofill</small>
                </div>
                <div class="demo-list" id="demoAccountsList">
                    <div class="demo-item" onclick="fillLogin('admin@uniflow.edu', 'admin123')">
                        <span class="demo-role">Super Admin</span>
                        <span class="demo-email">admin@uniflow.edu</span>
                    </div>
                    <div class="demo-item" onclick="fillLogin('hod.cs@uniflow.edu', 'password123')">
                        <span class="demo-role">CS Dept HOD</span>
                        <span class="demo-email">hod.cs@uniflow.edu</span>
                    </div>
                    <div class="demo-item" onclick="fillLogin('hod.me@uniflow.edu', 'password123')">
                        <span class="demo-role">Mech Dept HOD</span>
                        <span class="demo-email">hod.me@uniflow.edu</span>
                    </div>
                    <div class="demo-item" onclick="fillLogin('faculty@uniflow.edu', 'faculty123')">
                        <span class="demo-role">Faculty (Grace H.)</span>
                        <span class="demo-email">faculty@uniflow.edu</span>
                    </div>
                    <div class="demo-item" onclick="fillLogin('student@uniflow.edu', 'student123')">
                        <span class="demo-role">Student (Ada L.)</span>
                        <span class="demo-email">student@uniflow.edu</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
